[project]
name = "singfix"
version = "0.1.0"
description = "Learn to sing: key songs, track your voice, score against the melody"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.9",
    "torchaudio>=2.9",
    "demucs>=4.0.1",
    "torchcrepe>=0.0.23",
    "librosa>=0.11",
    "soundfile>=0.13",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "sounddevice>=0.5.6",
    "pedalboard>=0.9.26",
    "pyside6>=6.12.0",
    "pyqtgraph>=0.14.0",
]

[tool.uv]
cache-dir = "D:/packages/uv"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
